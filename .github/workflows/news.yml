name: news-bot
on:
  schedule:
    - cron: "*/5 * * * *"   # mỗi 5 phút (GitHub có thể trễ vài phút)
  workflow_dispatch: {}      # cho phép bấm chạy tay để thử
permissions:
  contents: write
concurrency:
  group: news-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata curl_cffi
      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TZ: Asia/Ho_Chi_Minh
          DIGEST_HOUR: "7"
          DIGEST_MIN: "0"
          ALERT_BEFORE_MIN: "30"
        run: python run_once.py
      - name: Lưu trạng thái
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)

